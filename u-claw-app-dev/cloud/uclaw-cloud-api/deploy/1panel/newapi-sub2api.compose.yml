name: uclaw-newapi-stack

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: uclaw-stack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BOOTSTRAP_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: uclaw-stack-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./redis/data:/data

  new-api:
    image: ${NEWAPI_IMAGE:-calciumion/new-api:latest}
    container_name: uclaw-new-api
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "${NEWAPI_HOST_BIND:-0.0.0.0}:${NEWAPI_HTTP_PORT:-3000}:3000"
    environment:
      TZ: Asia/Shanghai
      SQL_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${NEWAPI_DB}?sslmode=disable"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${NEWAPI_REDIS_DB}"
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET}
      CRYPTO_SECRET: ${NEWAPI_CRYPTO_SECRET}
      MEMORY_CACHE_ENABLED: "true"
    volumes:
      - ./newapi/data:/data
      - ./newapi/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sub2api:
    image: ${SUB2API_IMAGE:-weishaw/sub2api:latest}
    container_name: uclaw-sub2api
    restart: unless-stopped
    ports:
      - "${SUB2API_HOST_BIND:-0.0.0.0}:${SUB2API_HTTP_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      AUTO_SETUP: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: ${SUB2API_SERVER_MODE:-release}
      RUN_MODE: ${SUB2API_RUN_MODE:-standard}
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${SUB2API_DB}
      DATABASE_SSLMODE: disable
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${SUB2API_REDIS_DB}
      ADMIN_EMAIL: ${SUB2API_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SUB2API_ADMIN_PASSWORD}
      JWT_SECRET: ${SUB2API_JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${SUB2API_TOTP_ENCRYPTION_KEY}
    volumes:
      - ./sub2api/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
