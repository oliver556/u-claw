<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bavi-box - Loading</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif;
  background: #0a0a0a;
  color: #e0e0e0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  -webkit-app-region: drag;
}
.container {
  text-align: center;
  -webkit-app-region: no-drag;
}
.logo {
  width: 120px;
  height: 120px;
  margin: 0 auto 24px;
  animation: pulse 2s ease-in-out infinite;
}
.logo svg,
.logo img {
  width: 100%;
  height: 100%;
}
.logo img {
  display: block;
  border-radius: 24px;
  box-shadow: 0 0 0 1px rgba(22, 119, 255, 0.3), 0 16px 44px rgba(22, 119, 255, 0.26);
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.8; }
}
h1 {
  font-size: 2em;
  margin-bottom: 8px;
  font-weight: 600;
}
h1 span { color: #1677ff; }
.subtitle {
  color: #9ca3af;
  font-size: 1.1em;
  margin-bottom: 8px;
}
.version {
  color: #6b7280;
  font-size: 0.9em;
  margin-bottom: 28px;
  font-variant-numeric: tabular-nums;
}
.loader {
  width: 200px;
  height: 3px;
  background: #222;
  border-radius: 3px;
  margin: 0 auto 16px;
  overflow: hidden;
}
.loader-bar {
  height: 100%;
  width: 40%;
  background: linear-gradient(90deg, #1677ff, #69b1ff);
  border-radius: 3px;
  animation: loading 1.5s ease-in-out infinite;
}
@keyframes loading {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}
.status {
  color: #7b8494;
  font-size: 0.9em;
}
.status span {
  animation: dots 1.5s steps(4) infinite;
}
@keyframes dots {
  0% { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75% { content: '...'; }
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img src="../assets/icon.svg" alt="Bavi-box" />
  </div>
  <h1><span>Bavi-box</span></h1>
  <p class="subtitle">Bavi-box AI 工作空间</p>
  <p class="version" id="version">版本读取中...</p>
  <div class="loader"><div class="loader-bar"></div></div>
  <p class="status" id="status">正在启动 Bavi-box 工作空间...</p>
</div>

<script>
function formatVersion(value) {
  const text = String(value || '').trim();
  if (!text) return '';
  return text.startsWith('v') ? text : `v${text}`;
}

async function renderVersion() {
  try {
    if (!window.uclaw) return;
    const status = await window.uclaw.getGatewayStatus();
    const label = formatVersion(status?.appVersion);
    if (!label) return;
    document.getElementById('version').textContent = label;
    document.title = `Bavi-box ${label}`;
  } catch(e) {}
}

const messages = [
  '正在启动 Bavi-box 工作空间...',
  '正在启动 Bavi-box 引擎...',
  '检查配置文件...',
  '正在连接 Gateway...',
  '正在初始化 AI 网关...',
];
let i = 0;
setInterval(() => {
  document.getElementById('status').textContent = messages[i % messages.length];
  i++;
}, 2000);

/**
 * Polls Electron IPC until Gateway reports ready, then updates visible loading copy.
 */
async function checkReady() {
  try {
    if (window.uclaw) {
      const status = await window.uclaw.getGatewayStatus();
      if (status.ready) {
        document.getElementById('status').textContent = 'Bavi-box 已就绪';
        await window.uclaw.openDashboard();
        return;
      }
    }
  } catch(e) {}
  setTimeout(checkReady, 1000);
}
checkReady();
renderVersion();
</script>
</body>
</html>
