server {
    server_name video-adapter.yiyong.me;

    client_max_body_size 64m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /health {
        allow 127.0.0.1;
        allow 158.51.110.49;
        allow 121.41.89.103;
        allow 144.34.231.93;
        deny all;
        proxy_pass http://127.0.0.1:18808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        allow 121.41.89.103;
        allow 144.34.231.93;
        deny all;
        proxy_pass http://127.0.0.1:18808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/(v1|openai/v1)/ {
        allow 127.0.0.1;
        allow 158.51.110.49;
        allow 121.41.89.103;
        allow 144.34.231.93;
        deny all;
        proxy_pass http://127.0.0.1:18808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        deny all;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/video-adapter.yiyong.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video-adapter.yiyong.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = video-adapter.yiyong.me) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name video-adapter.yiyong.me;
    return 404;
}
