name: Portable launcher

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/portable-launcher.yml'
      - 'product/launcher/**'
      - 'product/offline-updater/**'
      - 'product/packaging/**'
      - 'product/scripts/portable-launcher-workflow.test.mjs'
      - 'product/scripts/runtime-manifest*'
      - 'product/tests/packaging/runtime-package.test.mjs'
      - 'product/tests/packaging/update-feed.test.mjs'
      - 'product/tests/windows/launcher-e2e.ps1'
      - 'product/tests/windows/offline-updater-e2e.ps1'
      - 'product/tests/windows/sign-license-fixture.mjs'
      - 'product/tests/windows/sign-runtime-fixture.mjs'
      - 'product/tests/windows/fixtures/portable-runtime*.go'
      - 'product/package.json'
      - 'product/package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    name: Windows portable launcher lifecycle
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Install locked Node dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --prefix product

      - name: Test workflow and packaging contracts
        shell: pwsh
        run: |
          npm run test:portable-launcher --prefix product
          if ($LASTEXITCODE -ne 0) { throw 'Portable launcher contract tests failed' }
          npm run test:update-packaging --prefix product
          if ($LASTEXITCODE -ne 0) { throw 'Update packaging tests failed' }
          node --test product/tests/packaging/runtime-package.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime packaging tests failed' }

      - name: Test formal Go launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location product\launcher
          try {
            go test -race ./...
            if ($LASTEXITCODE -ne 0) { throw 'Go launcher race tests failed' }
          }
          finally {
            Pop-Location
          }
          Push-Location product\offline-updater
          try {
            go test -race ./...
            if ($LASTEXITCODE -ne 0) { throw 'Go offline updater race tests failed' }
          }
          finally {
            Pop-Location
          }

      - name: Build windowsgui launcher and fixture runtime
        shell: pwsh
        env:
          UCLAW_RUNTIME_TRUSTED_PUBLIC_KEYS: ${{ vars.UCLAW_RUNTIME_TRUSTED_PUBLIC_KEYS }}
          UCLAW_LICENSE_TRUSTED_PUBLIC_KEYS: ${{ vars.UCLAW_LICENSE_TRUSTED_PUBLIC_KEYS }}
          UCLAW_LICENSE_STATUS_ENDPOINT: ${{ vars.UCLAW_LICENSE_STATUS_ENDPOINT }}
          UCLAW_LICENSE_STATUS_TRUSTED_PUBLIC_KEYS: ${{ vars.UCLAW_LICENSE_STATUS_TRUSTED_PUBLIC_KEYS }}
          UCLAW_RUNTIME_REVOKED_KEY_IDS: ${{ vars.UCLAW_RUNTIME_REVOKED_KEY_IDS }}
          UCLAW_RELEASE_BASE_URL: https://updates.yiyong.me/releases/
          UCLAW_ACTIVATION_ENDPOINT: ${{ vars.UCLAW_ACTIVATION_ENDPOINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:UCLAW_RUNTIME_TRUSTED_PUBLIC_KEYS)) {
            throw 'UCLAW_RUNTIME_TRUSTED_PUBLIC_KEYS is required for production Launcher builds'
          }
          if ([string]::IsNullOrWhiteSpace($env:UCLAW_LICENSE_TRUSTED_PUBLIC_KEYS)) {
            throw 'UCLAW_LICENSE_TRUSTED_PUBLIC_KEYS is required for production Launcher builds'
          }
          if ([string]::IsNullOrWhiteSpace($env:UCLAW_LICENSE_STATUS_ENDPOINT)) {
            throw 'UCLAW_LICENSE_STATUS_ENDPOINT is required for production Launcher builds'
          }
          if ([string]::IsNullOrWhiteSpace($env:UCLAW_LICENSE_STATUS_TRUSTED_PUBLIC_KEYS)) {
            throw 'UCLAW_LICENSE_STATUS_TRUSTED_PUBLIC_KEYS is required for production Launcher builds'
          }
          if ([string]::IsNullOrWhiteSpace($env:UCLAW_RELEASE_BASE_URL)) {
            throw 'UCLAW_RELEASE_BASE_URL is required for production Launcher builds'
          }
          if ([string]::IsNullOrWhiteSpace($env:UCLAW_ACTIVATION_ENDPOINT)) {
            throw 'UCLAW_ACTIVATION_ENDPOINT is required for production Launcher builds'
          }
          try {
            $trustedKeys = ConvertFrom-Json $env:UCLAW_RUNTIME_TRUSTED_PUBLIC_KEYS -AsHashtable
            if ($trustedKeys.Count -lt 1 -or $trustedKeys.Count -gt 16) { throw 'Trusted runtime key count is invalid' }
            foreach ($keyID in $trustedKeys.Keys) {
              if ($keyID -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$') { throw 'Trusted runtime key ID is invalid' }
              $keyBytes = [Convert]::FromBase64String($trustedKeys[$keyID])
              if ($keyBytes.Length -ne 32) { throw 'Trusted runtime key must be a raw Ed25519 public key' }
            }
            $licenseKeys = ConvertFrom-Json $env:UCLAW_LICENSE_TRUSTED_PUBLIC_KEYS -AsHashtable
            if ($licenseKeys.Count -lt 1 -or $licenseKeys.Count -gt 16) { throw 'Trusted license key count is invalid' }
            foreach ($keyID in $licenseKeys.Keys) {
              if ($keyID -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$') { throw 'Trusted license key ID is invalid' }
              $keyBytes = [Convert]::FromBase64String($licenseKeys[$keyID])
              if ($keyBytes.Length -ne 32) { throw 'Trusted license key must be a raw Ed25519 public key' }
            }
            $licenseStatusKeys = ConvertFrom-Json $env:UCLAW_LICENSE_STATUS_TRUSTED_PUBLIC_KEYS -AsHashtable
            if ($licenseStatusKeys.Count -lt 1 -or $licenseStatusKeys.Count -gt 16) { throw 'Trusted license status key count is invalid' }
            foreach ($keyID in $licenseStatusKeys.Keys) {
              if ($keyID -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$') { throw 'Trusted license status key ID is invalid' }
              $keyBytes = [Convert]::FromBase64String($licenseStatusKeys[$keyID])
              if ($keyBytes.Length -ne 32) { throw 'Trusted license status key must be a raw Ed25519 public key' }
            }
            $revokedKeyIDs = @(ConvertFrom-Json ($env:UCLAW_RUNTIME_REVOKED_KEY_IDS ?? '[]'))
            if ($revokedKeyIDs.Count -gt 64) { throw 'Revoked runtime key count is invalid' }
            foreach ($keyID in $revokedKeyIDs) {
              if ($keyID -isnot [string] -or $keyID -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$') { throw 'Revoked runtime key ID is invalid' }
            }
            $trustedKeysJson = ConvertTo-Json $trustedKeys -Compress
            $licenseKeysJson = ConvertTo-Json $licenseKeys -Compress
            $licenseStatusKeysJson = ConvertTo-Json $licenseStatusKeys -Compress
            $revokedKeyIDsJson = ConvertTo-Json @($revokedKeyIDs) -Compress
            $expectedReleaseBaseURL = 'https://updates.yiyong.me/releases/'
            $releaseURI = [Uri]$env:UCLAW_RELEASE_BASE_URL
            if ($releaseURI.AbsoluteUri -cne $expectedReleaseBaseURL) {
              throw "Production release feed must be $expectedReleaseBaseURL"
            }
            $releaseBaseURL = $releaseURI.AbsoluteUri
            $licenseStatusURI = [Uri]$env:UCLAW_LICENSE_STATUS_ENDPOINT
            if (!$licenseStatusURI.IsAbsoluteUri -or $licenseStatusURI.Scheme -cne 'https' -or $licenseStatusURI.UserInfo -or $licenseStatusURI.Query -or $licenseStatusURI.Fragment) {
              throw 'License status endpoint must be an HTTPS URL without credentials, query, or fragment'
            }
            $licenseStatusEndpoint = $licenseStatusURI.AbsoluteUri
            $activationURI = [Uri]$env:UCLAW_ACTIVATION_ENDPOINT
            if ($env:UCLAW_ACTIVATION_ENDPOINT -match "[\s'\\]") {
              throw 'Activation endpoint contains unsafe linker characters'
            }
            if (!$activationURI.IsAbsoluteUri -or $activationURI.Scheme -cne 'https' -or $activationURI.UserInfo -or $activationURI.Query -or $activationURI.Fragment) {
              throw 'Activation endpoint must be an HTTPS URL without credentials, query, or fragment'
            }
            $activationEndpoint = $activationURI.AbsoluteUri
          }
          catch {
            throw "Invalid production Launcher trust-root configuration: $($_.Exception.Message)"
          }
          $outputRoot = Join-Path $PWD 'product\.portable-launcher\bin'
          [void][IO.Directory]::CreateDirectory($outputRoot)
          $env:GOFLAGS = ''
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          Push-Location product\launcher
          try {
            if (Test-Path -LiteralPath rsrc_windows_amd64.syso) { throw 'Launcher resource output already exists' }
            try {
              go run github.com/akavel/rsrc@v0.10.2 -manifest app.manifest -arch amd64 -o rsrc_windows_amd64.syso
              if ($LASTEXITCODE -ne 0) { throw 'Launcher manifest generation failed' }
              $ldflags = "-s -w -H windowsgui -X 'main.trustedRuntimeKeys=$trustedKeysJson' -X 'main.trustedStartupLicenseKeys=$licenseKeysJson' -X 'main.trustedLicenseStatusKeys=$licenseStatusKeysJson' -X 'main.licenseStatusEndpoint=$licenseStatusEndpoint' -X 'main.revokedRuntimeKeyIDs=$revokedKeyIDsJson' -X 'main.releaseFeedBaseURL=$releaseBaseURL' -X 'main.activationServiceEndpoint=$activationEndpoint'"
              go build -trimpath -ldflags $ldflags -o (Join-Path $outputRoot 'U-Claw.exe') .
              if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
            }
            finally {
              Remove-Item -LiteralPath rsrc_windows_amd64.syso -Force -ErrorAction SilentlyContinue
            }
          }
          finally {
            Pop-Location
          }
          go test product\tests\windows\fixtures\portable-runtime.go product\tests\windows\fixtures\portable-runtime_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Fixture runtime tests failed' }
          go build -trimpath -o (Join-Path $outputRoot 'portable-runtime.exe') product\tests\windows\fixtures\portable-runtime.go
          if ($LASTEXITCODE -ne 0) { throw 'Fixture runtime build failed' }
          Push-Location product\offline-updater
          try {
            if (Test-Path -LiteralPath rsrc_windows_amd64.syso) { throw 'Offline updater resource output already exists' }
            try {
              go run github.com/akavel/rsrc@v0.10.2 -manifest app.manifest -arch amd64 -o rsrc_windows_amd64.syso
              if ($LASTEXITCODE -ne 0) { throw 'Offline updater manifest generation failed' }
              go build -trimpath -tags updaterfixture -ldflags '-s -w -H windowsgui' -o (Join-Path $outputRoot 'U-Claw-Update-fixture.exe') .
              if ($LASTEXITCODE -ne 0) { throw 'Offline updater build failed' }
            }
            finally {
              Remove-Item -LiteralPath rsrc_windows_amd64.syso -Force -ErrorAction SilentlyContinue
            }
          }
          finally {
            Pop-Location
          }

      - name: Windows PowerShell 5.1 portable lifecycle gate
        shell: powershell
        run: |
          .\product\tests\windows\launcher-e2e.ps1 `
            -LauncherExe product\.portable-launcher\bin\U-Claw.exe `
            -FixtureExe product\.portable-launcher\bin\portable-runtime.exe `
            -DiagnosticsPath product\.portable-launcher\diagnostics\windows-powershell-5.json `
            -CaseName windows-powershell-5
          .\product\tests\windows\offline-updater-e2e.ps1 `
            -OfflineUpdaterExe product\.portable-launcher\bin\U-Claw-Update-fixture.exe `
            -FixtureExe product\.portable-launcher\bin\portable-runtime.exe `
            -DiagnosticsPath product\.portable-launcher\diagnostics\offline-windows-powershell-5.json `
            -CaseName offline-windows-powershell-5

      - name: PowerShell 7 portable lifecycle gate
        shell: pwsh
        run: |
          .\product\tests\windows\launcher-e2e.ps1 `
            -LauncherExe product\.portable-launcher\bin\U-Claw.exe `
            -FixtureExe product\.portable-launcher\bin\portable-runtime.exe `
            -DiagnosticsPath product\.portable-launcher\diagnostics\powershell-7.json `
            -CaseName powershell-7
          .\product\tests\windows\offline-updater-e2e.ps1 `
            -OfflineUpdaterExe product\.portable-launcher\bin\U-Claw-Update-fixture.exe `
            -FixtureExe product\.portable-launcher\bin\portable-runtime.exe `
            -DiagnosticsPath product\.portable-launcher\diagnostics\offline-powershell-7.json `
            -CaseName offline-powershell-7

      - name: Upload sanitized lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-launcher-diagnostics
          path: product/.portable-launcher/diagnostics/*.json
          if-no-files-found: warn
